{% extends "base.html" %}

{% block title %}Add Event - EvenZa{% endblock %}

{% block content %}
<div class="page-header fade-in">
    <div>
        <h1><i class="fas fa-calendar-plus"></i>Add Calendar Event</h1>
        <div class="breadcrumb-simple">
            <a href="{{ url_for('calendar_view') }}">Calendar</a> /
            <span>Add Event</span>
        </div>
    </div>
</div>

<div class="form-section">
    <div>
        <div class="form-card">
            <div class="form-card-header"><h5>Event Details</h5></div>
            <div class="form-card-body">
                <form method="POST">
                    <div class="form-field">
                        <label for="name">Event Name *</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-field">
                        <label for="type">Event Type *</label>
                        <select id="type" name="type" required>
                            <option value="">Select Type</option>
                            {% for t in ['Workshop','Seminar','Conference','Meeting','Training','Competition','Cultural Event','Sports Event','Other'] %}
                            <option value="{{ t }}">{{ t }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-field">
                            <label for="event_date">Date *</label>
                            <input type="date" id="event_date" name="event_date" value="{{ prefill_date }}" required>
                        </div>
                        <div class="form-field">
                            <label for="start_time">Start Time *</label>
                            <input type="time" id="start_time" name="start_time" required>
                        </div>
                        <div class="form-field">
                            <label for="end_time">End Time *</label>
                            <input type="time" id="end_time" name="end_time" required>
                        </div>
                    </div>
                    <div class="form-field">
                        <label for="venue">Venue *</label>
                        <input type="text" id="venue" name="venue" required>
                    </div>
                    <div class="form-field">
                        <label for="host_school">Host School *</label>
                        <input type="text" id="host_school" name="host_school" required>
                    </div>
                    <div class="form-field">
                        <label for="participating_schools">Participating Schools</label>
                        <input type="text" id="participating_schools" name="participating_schools" placeholder="Comma-separated list">
                    </div>
                    <div class="form-field">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" rows="4"></textarea>
                    </div>
                    <div class="form-actions">
                        <a href="{{ url_for('calendar_view') }}" class="action-btn secondary">Cancel</a>
                        <button type="submit" class="action-btn"><i class="fas fa-save"></i>Add Event</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div></div>
</div>
{% endblock %}
